<script>window.CGL_API="https://script.google.com/macros/s/TEST/exec";window.CGL_TETE="<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>CGL — Gestion des lits<\/title>\n<meta name=\"theme-color\" content=\"#1F2A44\">\n<link rel=\"manifest\" href=\"manifest.webmanifest\">\n<link rel=\"icon\" href=\"icons/icon-192.png\">\n<link rel=\"apple-touch-icon\" href=\"icons/icon-180.png\">\n<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">\n<meta name=\"mobile-web-app-capable\" content=\"yes\">\n<meta name=\"apple-mobile-web-app-title\" content=\"CGL\">\n<meta name=\"apple-mobile-web-app-status-bar-style\" content=\"black-translucent\">\n<style>#cgl-login{position:fixed;inset:0;z-index:100000;display:none;align-items:center;justify-content:center;background:#1F2A44;padding:24px;font-family:'Public Sans',system-ui,sans-serif}\n#cgl-login .cl-card{background:#fff;border-radius:22px;padding:32px 28px;max-width:380px;width:100%;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;color:#1F2633;box-shadow:0 20px 60px rgba(0,0,0,.35)}\n#cgl-login img{border-radius:16px}#cgl-login small{font-size:11px;letter-spacing:.16em;color:#646B79;font-weight:700}\n#cgl-login h1{margin:0;font-size:26px;color:#1F2A44}#cgl-login p{margin:0;font-size:14px;color:#3A4F6E}\n#cgl-gbtn{min-height:44px;margin:8px 0}#cgl-login .cl-pied{font-size:12px;color:#646B79}\n#cgl-login .cl-ou{width:100%;display:flex;align-items:center;gap:8px;color:#646B79;font-size:12px;margin:4px 0}\n#cgl-login .cl-ou:before,#cgl-login .cl-ou:after{content:\"\";flex:1;height:1px;background:#DCE1E8}\n#cgl-login .cl-f{width:100%;display:flex;flex-direction:column;gap:8px}\n#cgl-login .cl-f input{min-height:48px;border-radius:12px;border:1.5px solid #C7CFDA;padding:0 14px;font-size:16px;text-align:center}\n#cgl-login .cl-f button{min-height:48px;border-radius:24px;border:0;background:#1F2A44;color:#fff;font-weight:700;font-size:15px}\n#cgl-login .cl-f button:disabled{opacity:.6}#cgl-login .cl-f a{font-size:13px;color:#3A4F6E}\n<\/style>\n<script>window.CGL_CONFIG={\"api\":\"https://script.google.com/macros/s/TEST/exec\",\"clientId\":\"\"};<\/script>\n<script>/* CGL · application installable : remplace google.script.run par des appels sécurisés au classeur (Apps Script). */\n(function () {\n  var C = window.CGL_CONFIG || {}, API = C.api, CID = C.clientId;\n  var tok = null, exp = 0, file = [], enCours = false, gisPret = false;\n  // jeton Google (1 h, onglet) ou session par code e-mail (30 jours, appareil)\n  try { var s = JSON.parse(sessionStorage.getItem('cgl_tok') || localStorage.getItem('cgl_sess') || 'null'); if (s && s.exp > Date.now() + 60000) { tok = s.t; exp = s.exp; } } catch (e) {}\n  function estSession() { return !!tok && tok.indexOf('S.') === 0; }\n  function decode(t) { try { return JSON.parse(atob(t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))); } catch (e) { return {}; } }\n  function garder(t) {\n    var p = decode(t); tok = t; exp = (p.exp || 0) * 1000;\n    try { sessionStorage.setItem('cgl_tok', JSON.stringify({ t: t, exp: exp })); } catch (e) {}\n    masquer(); vider();\n  }\n  function garderSession(r) {\n    tok = r.t; exp = r.exp;\n    try { localStorage.setItem('cgl_sess', JSON.stringify({ t: r.t, exp: r.exp })); } catch (e) {}\n    masquer(); vider();\n  }\n  function oublier() { tok = null; exp = 0; try { sessionStorage.removeItem('cgl_tok'); localStorage.removeItem('cgl_sess'); } catch (e) {} }\n  function post(f, a, t) {\n    return fetch(API, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ t: t || '', f: f, a: a || [] }) })\n      .then(function (r) { return r.json(); });\n  }\n  // ---------- écran de connexion ----------\n  function ecran(msg) {\n    var o = document.getElementById('cgl-login');\n    if (!o) {\n      o = document.createElement('div'); o.id = 'cgl-login';\n      o.innerHTML = '<div class=\"cl-card\"><img src=\"icons/icon-192.png\" alt=\"\" width=\"72\" height=\"72\"><small>CELLULE DE GESTION DES LITS<\/small><h1>CGL · HEGP<\/h1>' +\n        '<p id=\"cgl-login-msg\"><\/p>' + (CID ? '<div id=\"cgl-gbtn\"><\/div><div class=\"cl-ou\"><span>ou, sans compte Google<\/span><\/div>' : '') +\n        '<form id=\"cgl-f1\" class=\"cl-f\"><input id=\"cgl-mail\" type=\"email\" autocomplete=\"email\" placeholder=\"Votre adresse e-mail\" required><button type=\"submit\">Recevoir un code<\/button><\/form>' +\n        '<form id=\"cgl-f2\" class=\"cl-f\" style=\"display:none\"><input id=\"cgl-code\" inputmode=\"numeric\" autocomplete=\"one-time-code\" maxlength=\"6\" placeholder=\"Code à 6 chiffres\" required><button type=\"submit\">Se connecter<\/button><a href=\"#\" id=\"cgl-autre\">Changer d’adresse<\/a><\/form>' +\n        '<p class=\"cl-pied\">Accès réservé aux personnes autorisées par la cellule.<\/p><\/div>';\n      (document.body || document.documentElement).appendChild(o);\n      var m = document.getElementById('cgl-mail'), c = document.getElementById('cgl-code'), f1 = document.getElementById('cgl-f1'), f2 = document.getElementById('cgl-f2');\n      try { m.value = localStorage.getItem('cgl_mail') || ''; } catch (e) {}\n      var info = function (t) { document.getElementById('cgl-login-msg').textContent = t; };\n      f1.onsubmit = function (ev) {\n        ev.preventDefault(); var b = f1.querySelector('button'); b.disabled = true; info('Envoi du code…');\n        try { localStorage.setItem('cgl_mail', m.value.trim()); } catch (e) {}\n        post('authCode', [m.value.trim()]).then(function (x) {\n          b.disabled = false;\n          if (!x.ok) { info(x.e); return; }\n          info(x.r.msg); f1.style.display = 'none'; f2.style.display = 'flex'; c.value = ''; c.focus();\n        }).catch(function () { b.disabled = false; info('Connexion impossible : vérifiez internet.'); });\n      };\n      f2.onsubmit = function (ev) {\n        ev.preventDefault(); var b = f2.querySelector('button'); b.disabled = true; info('Vérification…');\n        post('authVerif', [m.value.trim(), c.value]).then(function (x) {\n          b.disabled = false;\n          if (!x.ok) { info(x.e); return; }\n          f2.style.display = 'none'; f1.style.display = 'flex'; garderSession(x.r);\n        }).catch(function () { b.disabled = false; info('Connexion impossible : vérifiez internet.'); });\n      };\n      document.getElementById('cgl-autre').onclick = function (ev) { ev.preventDefault(); f2.style.display = 'none'; f1.style.display = 'flex'; m.focus(); };\n    }\n    document.getElementById('cgl-login-msg').textContent = msg || (CID ? 'Connectez-vous avec votre compte Google ou avec un code reçu par e-mail.' : 'Indiquez votre adresse e-mail : vous recevrez un code de connexion.');\n    o.style.display = 'flex';\n    if (gisPret) google.accounts.id.renderButton(document.getElementById('cgl-gbtn'), { theme: 'filled_blue', size: 'large', shape: 'pill', text: 'signin_with', locale: 'fr' });\n  }\n  function masquer() { var o = document.getElementById('cgl-login'); if (o) o.style.display = 'none'; }\n  window.cglDeconnexion = function () { if (estSession()) post('authOut', [], tok).catch(function () {}); oublier(); try { google.accounts.id.disableAutoSelect(); } catch (e) {} ecran('Vous êtes déconnecté.'); };\n  // ---------- Google Identity Services ----------\n  window.cglGisCharge = function () {\n    google.accounts.id.initialize({ client_id: CID, callback: function (r) { if (r && r.credential) garder(r.credential); }, auto_select: true, use_fedcm_for_prompt: true, cancel_on_tap_outside: false, itp_support: true });\n    gisPret = true;\n    if (!tok) { google.accounts.id.prompt(function (n) { if (n.isNotDisplayed && n.isNotDisplayed() || n.isSkippedMoment && n.isSkippedMoment()) ecran(); }); ecran(); }\n  };\n  function renouveler() {\n    var sess = estSession(); oublier();\n    if (sess) { ecran('Votre session a expiré : reconnectez-vous.'); return; }\n    if (gisPret) { google.accounts.id.prompt(); ecran('Votre session a expiré : reconnectez-vous.'); } else ecran(); }\n  // ---------- appels au classeur ----------\n  function vider() {\n    if (!tok) return;\n    var l = file; file = [];\n    l.forEach(envoyer);\n  }\n  function envoyer(j) {\n    if (!tok || exp < Date.now() + 30000) { file.push(j); renouveler(); return; }\n    post(j.f, j.a, tok)\n      .then(function (x) {\n        if (x && x.ok) { if (j.ok) j.ok(x.r); return; }\n        var e = x && x.e || 'Erreur inconnue';\n        if (e === 'AUTH' && !j.essai) { j.essai = 1; file.push(j); renouveler(); return; }\n        if (e === 'ACCES') { ecran('Ce compte n’a pas accès à l’application. Demandez l’accès à la cellule, ou changez de compte.'); }\n        if (j.ko) j.ko(new Error(e === 'ACCES' ? 'Accès refusé pour ce compte.' : e));\n      })\n      .catch(function (err) { if (j.ko) j.ko(new Error('Connexion impossible : vérifiez internet (' + (err && err.message || err) + ').')); });\n  }\n  function run(ok, ko) {\n    return new Proxy({}, { get: function (_, k) {\n      if (k === 'withSuccessHandler') return function (f) { return run(f, ko); };\n      if (k === 'withFailureHandler') return function (f) { return run(ok, f); };\n      if (k === 'withUserObject') return function () { return run(ok, ko); };\n      return function () { var j = { f: String(k), a: [].slice.call(arguments), ok: ok, ko: ko }; if (tok) envoyer(j); else file.push(j); };\n    } });\n  }\n  window.google = window.google || {};\n  window.google.script = { run: run(null, null), host: { close: function () {}, setHeight: function () {}, setWidth: function () {} } };\n  // ---------- installation / mises à jour ----------\n  if ('serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js').catch(function () {}); } catch (e) {} }\n  // sans connexion Google : l'écran de connexion s'affiche dès le chargement s'il n'y a pas de session\n  if (!CID && !tok) { if (document.body) ecran(); else document.addEventListener('DOMContentLoaded', function () { ecran(); }); }\n})();\n<\/script>\n";</script>
<script>/* CGL · coque de l'application installable : l'interface vient du classeur (Apps Script) et est gardée sur l'appareil.
   Une mise à jour de l'application (« déploie ») arrive donc ici toute seule, sans rien changer sur GitHub. Aucune donnée patient n'est gardée. */
(function () {
  var K = 'cgl_app', API = window.CGL_API;
  function lire() { try { return JSON.parse(localStorage.getItem(K) || 'null'); } catch (e) { return null; } }
  function garder(o) { try { localStorage.setItem(K, JSON.stringify(o)); } catch (e) {} }
  function charger() { return fetch(API + '?app=pwa', { redirect: 'follow', cache: 'no-store' }).then(function (r) { return r.json(); }); }
  function afficher(o) {
    var h = String(o.h), i = h.indexOf('<head>');
    h = h.slice(0, i + 6) + '\n' + window.CGL_TETE + h.slice(i + 6).replace('<base target="_top">', '');
    document.open(); document.write(h); document.close();
  }
  function bandeau() {
    var d = document.createElement('div'); d.className = 'nv-band';
    d.innerHTML = '<span>Une nouvelle version de l’application est prête.</span><a href="#" onclick="location.reload();return false">Mettre à jour</a>';
    (document.body || document.documentElement).appendChild(d);
  }
  function echec() {
    document.body.innerHTML = '<div class="cgl-boot"><b>CGL · HEGP</b><p>Connexion impossible : vérifiez internet.</p><button onclick="location.reload()">Réessayer</button></div>';
  }
  var c = lire();
  if (c && c.h) {
    afficher(c);
    charger().then(function (n) { if (n && n.h && n.v !== c.v) { garder(n); bandeau(); } }).catch(function () {});
  } else {
    charger().then(function (n) { if (!n || !n.h) throw new Error('vide'); garder(n); afficher(n); }).catch(echec);
  }
})();
</script>
